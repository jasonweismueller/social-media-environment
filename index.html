<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Study Environment</title>

    <!--
      "Add to Home Screen" support (iOS PWA), admin-focused: lets the admin
      dashboard be launched from a home-screen icon as a standalone window
      (no Safari chrome), separate from the participant-facing apps.
      Deliberately no service worker / offline caching — the admin tool
      always needs a live Supabase connection, so there's no useful offline
      mode to build, and adding one risks silently serving a stale bundle.
      For this to open straight into the dashboard rather than Safari's
      current tab, add the icon while already on https://studyfeed.org/admin
      (some iOS versions bookmark "whatever page is open" rather than
      honoring `start_url` below).
    -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#4338ca">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Study Admin">
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png">
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">

    <script>
      window.CONFIG = {
        // GAS proxy (Lambda/API Gateway)
        GAS_PROXY_BASE: "https://qkbi313c2i.execute-api.us-west-1.amazonaws.com",
        GAS_PROXY_PATH: "/default/gas",

        // Convenience: some helpers use API_BASE directly
        API_BASE: "https://qkbi313c2i.execute-api.us-west-1.amazonaws.com/default/gas",

        // S3 presigner/CDN
        SIGNER_BASE: "https://qkbi313c2i.execute-api.us-west-1.amazonaws.com",
        SIGNER_PATH: "/default/presign-upload",
        CF_BASE: "https://d2bihrgvtn9bga.cloudfront.net"
      };
    </script>
  </head>

  <body>
    <div id="root"></div>

<script>
  // Single Page Apps for GitHub Pages
  // https://github.com/rafgraph/spa-github-pages
  //
  // Pairs with public/404.html: decodes a path 404.html encoded into the
  // query string back into a real pathname via the History API, before the
  // app (and its BrowserRouter) ever mounts.
  (function (l) {
    if (l.search[1] === "/") {
      const decoded = l.search
        .slice(1)
        .split("&")
        .map((s) => s.replace(/~and~/g, "&"))
        .join("?");
      window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
    }
  })(window.location);

  // One-time migration for old bookmarked hash-style admin links
  // (studyfeed.org/#/admin/...), from before this app switched from
  // HashRouter to BrowserRouter. Real participant launch links never put
  // anything in the hash, so this only ever matters for /admin.
  (function () {
    const path = window.location.pathname;
    if (path !== "/" && path !== "") return;
    const h = window.location.hash || "";
    if (!h.startsWith("#/")) return;
    const rest = h.slice(1);
    const hashPath = rest.split("?")[0];
    const hashQuery = rest.includes("?") ? rest.slice(rest.indexOf("?") + 1) : "";
    const existingSearch = window.location.search ? window.location.search.slice(1) : "";
    const mergedQuery = [existingSearch, hashQuery].filter(Boolean).join("&");
    window.history.replaceState(null, "", hashPath + (mergedQuery ? "?" + mergedQuery : ""));
  })();
</script>
<script type="module">
  const params = new URLSearchParams(window.location.search);

  // Only load the app bundle for a recognized entry: a real participant
  // launch link (?feed=/?feed_id=/?survey=/?survey_id=) or the admin route
  // (/admin...). Anyone who just stumbles onto the bare domain gets a blank
  // page instead of falling through to whatever feed happens to be default.
  const hash = window.location.hash || "";
  const hashQuery = hash.includes("?") ? hash.slice(hash.indexOf("?") + 1) : "";
  const hashParams = new URLSearchParams(hashQuery);
  const getParam = (key) => params.get(key) || hashParams.get(key);

  const isAdminRoute = window.location.pathname.startsWith("/admin");
  const hasLaunchParams = !!(
    getParam("feed") || getParam("feed_id") ||
    getParam("survey") || getParam("survey_id")
  );

  // Which platform bundle to load. A real participant launch link should
  // always carry its own explicit `?app=` — never guessed — so that half is
  // untouched. But the admin dashboard is one continuous browsing session
  // across many client-side route changes (sidebar nav links, the platform
  // picker's "already on this platform" shortcut), several of which
  // navigate to a bare path like `/admin/dashboard/feeds` with no query
  // string at all, silently dropping `?app=` from the address bar — it
  // doesn't matter while the SPA stays mounted (the loaded bundle already
  // knows what it is), but a hard reload re-runs this script from scratch
  // with only the now-`app`-less URL to go on, and always fell back to
  // Facebook. `getProjectId()` (utils-core.js) already avoids the identical
  // problem for `?project=` via a localStorage fallback — this mirrors that
  // same "URL wins, localStorage remembers the last real value" pattern,
  // scoped to admin routes only so a participant's own launch link (which
  // never touches this key) can never be affected by a previous admin
  // session on the same browser/device.
  const ADMIN_APP_KEY = "admin_app_v1";
  let app = (params.get("app") || "").toLowerCase();
  if (!app && isAdminRoute) {
    try { app = (localStorage.getItem(ADMIN_APP_KEY) || "").toLowerCase(); } catch {}
  }
  if (!app) app = "facebook";
  if (isAdminRoute) {
    try { localStorage.setItem(ADMIN_APP_KEY, app); } catch {}
  }

  if (isAdminRoute || hasLaunchParams) {
    const entryMap = {
      facebook: () => import("./src/main-facebook.jsx"),
      fb: () => import("./src/main-facebook.jsx"),

      instagram: () => import("./src/main-instagram.jsx"),
      ig: () => import("./src/main-instagram.jsx"),

      amazon: () => import("./src/main-amazon.jsx"),
      amz: () => import("./src/main-amazon.jsx"),
      reviews: () => import("./src/main-amazon.jsx"),

      x: () => import("./src/main-x.jsx"),
      twitter: () => import("./src/main-x.jsx"),
    };

    // Publish the resolved platform on `window.APP` BEFORE the bundle is
    // imported. The `window.APP = "ig"` line inside each main-*.jsx runs too
    // late to help: ES imports are hoisted, so every module those files
    // import (utils-backend's `APP`, ui-posts/ui-core's per-app dispatch,
    // components-admin-dashboard's editor/label picks) evaluates first, and
    // with no `?app=` in the URL (the normal state after an in-admin
    // navigation + reload) they all silently fell back to Facebook — an
    // Instagram bundle with a Facebook-flavored dashboard/preview.
    const canonicalApp = {
      facebook: "fb", fb: "fb",
      instagram: "ig", ig: "ig",
      amazon: "amz", amz: "amz", reviews: "amz",
      x: "x", twitter: "x",
    };
    window.APP = canonicalApp[app] || "fb";

    (entryMap[app] || entryMap.facebook)();
  } else {
    document.title = "404 Not Found";
    document.getElementById("root").innerHTML = `
      <div style="
        display:flex; align-items:center; justify-content:center;
        min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,
        'Segoe UI',Roboto,Helvetica,Arial,sans-serif; color:#444;
        text-align:center; padding:24px; box-sizing:border-box;
      ">
        <div>
          <h1 style="font-size:22px; font-weight:600; margin:0 0 8px;">404</h1>
          <p style="font-size:15px; margin:0; color:#777;">This page could not be found.</p>
        </div>
      </div>
    `;
  }
</script>
  </body>
</html>
