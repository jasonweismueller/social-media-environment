    <script>

  <body>
    <div id="root"></div>

<script>
  // Single Page Apps for GitHub Pages
  // https://github.com/rafgraph/spa-github-pages
  //
  // Pairs with public/404.html: decodes a path 404.html encoded into the
  // query string back into a real pathname via the History API, before the
  // app (and its BrowserRouter) ever mounts.
  (function (l) {
    if (l.search[1] === "/") {
      const decoded = l.search
        .slice(1)
        .split("&")
        .map((s) => s.replace(/~and~/g, "&"))
        .join("?");
      window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
    }
  })(window.location);

  // One-time migration for old bookmarked hash-style admin links
  // (studyfeed.org/#/admin/...), from before this app switched from
  // HashRouter to BrowserRouter. Real participant launch links never put
  // anything in the hash, so this only ever matters for /admin.
  (function () {
    const path = window.location.pathname;
    if (path !== "/" && path !== "") return;
    const h = window.location.hash || "";
    if (!h.startsWith("#/")) return;
    const rest = h.slice(1);
    const hashPath = rest.split("?")[0];
    const hashQuery = rest.includes("?") ? rest.slice(rest.indexOf("?") + 1) : "";
    const existingSearch = window.location.search ? window.location.search.slice(1) : "";
    const mergedQuery = [existingSearch, hashQuery].filter(Boolean).join("&");
    window.history.replaceState(null, "", hashPath + (mergedQuery ? "?" + mergedQuery : ""));
  })();
</script>
<script type="module">
  const params = new URLSearchParams(window.location.search);
  const app = (params.get("app") || "facebook").toLowerCase();

  // Only load the app bundle for a recognized entry: a real participant
  // launch link (?feed=/?feed_id=/?survey=/?survey_id=) or the admin route
  // (/admin...). Anyone who just stumbles onto the bare domain gets a blank
  // page instead of falling through to whatever feed happens to be default.
  const hash = window.location.hash || "";
  const hashQuery = hash.includes("?") ? hash.slice(hash.indexOf("?") + 1) : "";
  const hashParams = new URLSearchParams(hashQuery);
  const getParam = (key) => params.get(key) || hashParams.get(key);

  const isAdminRoute = window.location.pathname.startsWith("/admin");
  const hasLaunchParams = !!(
    getParam("feed") || getParam("feed_id") ||
    getParam("survey") || getParam("survey_id")
  );

  if (isAdminRoute || hasLaunchParams) {
    const entryMap = {
      facebook: () => import("./src/main-facebook.jsx"),
      fb: () => import("./src/main-facebook.jsx"),

      instagram: () => import("./src/main-instagram.jsx"),
      ig: () => import("./src/main-instagram.jsx"),

      amazon: () => import("./src/main-amazon.jsx"),
      amz: () => import("./src/main-amazon.jsx"),
      reviews: () => import("./src/main-amazon.jsx"),
    };

    (entryMap[app] || entryMap.facebook)();
  } else {
    document.title = "404 Not Found";
    document.getElementById("root").innerHTML = `
      <div style="
        display:flex; align-items:center; justify-content:center;
        min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,
        'Segoe UI',Roboto,Helvetica,Arial,sans-serif; color:#444;
        text-align:center; padding:24px; box-sizing:border-box;
      ">
        <div>
          <h1 style="font-size:22px; font-weight:600; margin:0 0 8px;">404</h1>
          <p style="font-size:15px; margin:0; color:#777;">This page could not be found.</p>
        </div>
      </div>
    `;
  }
</script>
  </body>
</html>
