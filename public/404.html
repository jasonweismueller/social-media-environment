<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Study Environment</title>
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      //
      // GitHub Pages only serves real files — a direct request to a clean
      // path like /admin/dashboard/feeds 404s here, since no such file
      // exists on disk (this app is a client-side-routed SPA, see
      // index.html). This encodes the intended path into a query string and
      // redirects to the real index.html, which decodes it back into a real
      // pathname via the History API before the app (and its BrowserRouter)
      // ever mounts. studyfeed.org / staging.studyfeed.org are both served
      // from the domain root (custom domains, not a github.io/reponame/
      // path), so pathSegmentsToKeep is 0 for both.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
